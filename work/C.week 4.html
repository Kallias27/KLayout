<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kallie</title>
</head>

<body>
    <center>
        <table border="3">
            <tr>
                <td colspan="2"><b>Pizza Shop Version 2.0</b></td>
            </tr>
            <tr>
                <td>Name: </td>
                <td> <input type="text"></td>
            </tr>
            <tr>
                <td>Pizza Topping:</td>
                <td>
                    <input type="radio"> Supreme
                    <input type="radio"> Vegetarian
                    <input type="radio"> Hawaiian
                </td> 
            </tr>
            <tr>
                <td>Pizza Sauce:</td>
                <td>
                    <select name="" id="">
                        <option value="">Tomato</option>
                        <option value="">BQQ</option>
                        <option value="">Spicy</option>
                        <option value="">Tomyum</option>
                    </select>
                </td>
            </tr>
             <tr>
                <td>Pizza Size:</td>
                <td>
                    <select name="" id="">
                        <option value="">Small</option>
                        <option value="">Medium</option>
                        <option value="">Large</option>
                        <option value="">Extra Large</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Optional Extra:</td>
                <td>
                    <input type="checkbox">Extra Cheese
                    <input type="checkbox">Extra Pepperoni
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    Delivery Address: 
                    <textarea name="" id=""></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                   <button>Place Order!</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
